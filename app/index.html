<!doctype html>
<!--
  `lang` is rewritten per locale by scripts/prerender.ts, and again at run time by lib/i18n when
  the reader changes language. The whole tag is the marker, so keep it on one line.
-->
<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="theme-color" content="#05070a" />

    <!--
      These tags describe the landing page, because that is what a stranger and a link preview
      hit. Every claim here is on the list in
      docs/specs/2026-08-12-surfaces-and-claims.md. Nothing else goes in.

      Everything between the two `seo` markers is GENERATED, by `head()` in src/lib/seo.ts, and
      the build writes one copy of it per language. What stands here is the English page — the
      copy Vite serves in development, and the one a reader gets at `/`. Do not hand-edit it:
      `seo.test.ts` compares this block to `head('en')` character for character, so an edit here
      is a failing test rather than a page that quietly disagrees with the other thirty-four.

      The `hreflang` rows are identical in every copy. That is what makes a crawler read the
      thirty-five as one page in thirty-five languages rather than as thirty-five thin ones.
    -->
    <!--seo-->
    <title>prove.cash — sign a swap offer, send no transaction</title>
